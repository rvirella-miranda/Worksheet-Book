<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worksheet Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" aria-live="polite">
  <div class="wrap"><p class="muted">Loading your book…</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig, DEFAULT_BOOK_ID, DEFAULT_BOOK_TITLE } from "./config.js";
import * as L from "./lib.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
// Auth is loaded only so a signed-in teacher can preview closed worksheets.
// Students never sign in.
const auth = getAuth(app);

const params = new URLSearchParams(location.search);
const BOOK_ID = (params.get("book") || DEFAULT_BOOK_ID).replace(/[^A-Za-z0-9_-]/g, "");
const root = document.getElementById("app");

// Link to this book's teacher panel. It opens in a new tab because Google
// sign-in doesn't work inside a Google Sites embed.
function teacherLink() {
  const u = new URL("teacher.html", location.href);
  if (BOOK_ID !== DEFAULT_BOOK_ID) u.searchParams.set("book", BOOK_ID);
  return u.toString();
}
const footer = () => `<footer class="page-foot">
  <a class="teacher-link" href="${esc(teacherLink())}" target="_blank" rel="noopener">Teacher</a>
</footer>`;

const state = {
  book: null,
  groups: [],
  unit: null,          // unit shown on the contents page
  openBefore: null,    // Set of lesson ids that were open on the last render
  justOpened: new Set(),
  pageCache: new Map() // sheetId -> [{id, img}]
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

// ---------- Live book data ----------
onSnapshot(doc(db, "books", BOOK_ID), (snap) => {
  state.book = snap.exists() ? snap.data() : { lessons: {}, released: {} };
  state.groups = L.groupLessons(state.book);

  const openNow = new Set();
  for (const g of state.groups) for (const l of g.lessons) if (L.lessonOpen(state.book, l)) openNow.add(l.id);
  state.justOpened = state.openBefore
    ? new Set([...openNow].filter((id) => !state.openBefore.has(id)))
    : new Set();
  state.openBefore = openNow;

  if (!state.unit || !state.groups.some((g) => g.unit === state.unit)) {
    state.unit = L.defaultUnit(state.book, state.groups);
  }
  // Re-render the contents page live. Leave an open worksheet alone.
  const sid = currentSheetId();
  if (!sid || !state.viewerShown) route();
  else if (state.lockedSid === sid && (L.isReleased(state.book, sid) || (L.isTicketId(sid) && L.ticketReleased(state.book, L.lessonIdFromTicket(sid))))) {
    // A student was waiting on a closed worksheet and it just opened.
    state.lockedSid = null; route();
  }
}, (err) => {
  console.error(err);
  root.innerHTML = `<div class="wrap"><div class="notice"><h2>The book didn't load</h2>
    <p class="muted">Check your internet connection, then reload the page.</p></div></div>`;
});

// Class roster (public names only). When it has students, exit tickets use a
// name menu and allow one response per student.
state.roster = {};
onSnapshot(doc(db, "books", BOOK_ID, "roster", "main"), (snap) => {
  state.roster = (snap.exists() && snap.data().students) || {};
}, () => { state.roster = {}; });

let authReady = false;
onAuthStateChanged(auth, () => {
  // If a teacher's session appears after a locked sheet was shown, retry it.
  const first = !authReady;
  authReady = true;
  if (!first && currentSheetId()) { state.pageCache.delete(currentSheetId()); route(); }
});

window.addEventListener("hashchange", () => { state.viewerShown = false; route(); });

function currentSheetId() {
  const h = decodeURIComponent(location.hash.slice(1));
  return /^[a-z0-9-]+$/.test(h) ? h : "";
}

function route() {
  if (!state.book) return;
  const sid = currentSheetId();
  if (sid && L.isTicketId(sid)) {
    const lessonId = L.lessonIdFromTicket(sid);
    const lesson = state.book.lessons && state.book.lessons[lessonId];
    if (lesson && lesson.ticket) { state.viewerShown = true; renderTicket(lessonId, lesson); return; }
  }
  const found = sid ? L.findSheet(state.book, sid) : null;
  if (found) { state.viewerShown = true; renderViewer(sid, found); }
  else renderContents();
}


// Refresher links open in a new tab so the workbook stays open.
function refresherHTML(lesson, where) {
  const links = L.safeLinks(lesson);
  if (!links.length) return "";
  return `<div class="refresh ${where}">
    <span class="refresh-label">Need a refresher?</span>
    <span class="refresh-links">${links.map((k) => `<a class="refresh-link" href="${esc(k.url)}" target="_blank" rel="noopener noreferrer"
      title="Opens ${esc(k.site)} in a new tab"><span class="play" aria-hidden="true">\u25B6</span>${esc(k.title)}<span class="sr-only"> (opens in a new tab)</span></a>`).join("")}</span>
  </div>`;
}

// ---------- Contents page ----------
function renderContents() {
  document.title = state.book.title || DEFAULT_BOOK_TITLE;
  const title = esc(state.book.title || DEFAULT_BOOK_TITLE);
  const head = `
    <header class="hero">
      <div class="eyebrow">Mrs. Miranda\u2019s Class</div>
      <h1>${title}</h1>
      <p class="tagline">Think. Plan. Solve. Check. New worksheets show up here as soon as they\u2019re assigned.</p>
    </header>`;

  if (!state.groups.length) {
    root.innerHTML = `<div class="wrap">${head}
      <div class="notice taped"><h2>No worksheets yet</h2>
      <p class="muted">Your teacher hasn\u2019t added any worksheets. Check back after class.</p></div>${footer()}</div>`;
    return;
  }

  const group = state.groups.find((g) => g.unit === state.unit) || state.groups[0];
  const seg = state.groups.length > 1 ? `
    <div class="seg" role="tablist" aria-label="Units">
      ${state.groups.map((g) => `<button class="tab" role="tab" data-unit="${esc(g.unit)}"
        aria-selected="${g.unit === group.unit}" title="${esc(g.unitTitle)}">Unit ${esc(g.unit)}</button>`).join("")}
    </div>` : "";

  const openCount = group.lessons.filter((l) => L.lessonOpen(state.book, l)).length;
  const openSheets = group.lessons.reduce((n, l) => n + l.sheetList.filter((s) => L.isReleased(state.book, s.id)).length, 0);

  const cards = group.lessons.map((l, i) => {
    const open = L.lessonOpen(state.book, l);
    const buttons = l.sheetList
      .filter((s) => L.isReleased(state.book, s.id))
      .map((s) => `<a class="btn open" href="#${esc(s.id)}">${esc(s.label)} </a>`).join("")
      + (L.ticketReleased(state.book, l.id)
        ? `<a class="btn ticket" href="#${esc(L.ticketIdFor(l.id))}">Exit ticket</a>` : "");
    return `<li class="lesson ${open ? `is-open taped s${(i % 5) + 1}` : ""}" id="row-${esc(l.id)}">
      <div class="eyebrow">Lesson ${l.num}</div>
      <div class="title">${esc(l.title)}</div>
      ${open ? refresherHTML(l, "on-card") : ""}
      <div class="foot">
        ${open ? `<span class="actions">${buttons}</span>` : `<span class="soon">Not assigned yet</span>`}
      </div>
    </li>`;
  }).join("");

  root.innerHTML = `<div class="wrap">
    ${head}
    ${seg}
    <div class="stats">
      <div class="stat"><div class="n">${openCount}</div><div class="l">Lessons open</div></div>
      <div class="stat"><div class="n">${openSheets}</div><div class="l">Worksheets open</div></div>
      <div class="stat"><div class="n">${group.lessons.length}</div><div class="l">In this unit</div></div>
    </div>
    <div class="section">
      <div class="eyebrow plum">This unit</div>
      <h2>${esc(group.unitTitle)}</h2>
      <div class="count">${openCount} of ${group.lessons.length} lessons open</div>
    </div>
    <div class="graph-card taped">${graphSvg(group, openCount)}</div>
    <ol class="lessons">${cards}</ol>
    ${footer()}
  </div>`;

  root.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
    state.unit = b.dataset.unit; state.justOpened = new Set(); renderContents();
  }));
}

// The unit drawn as a line: each lesson is a point; the line is inked in
// up to the furthest lesson that's open.
function graphSvg(group, openCount) {
  const W = 720, H = 150, padL = 30, padR = 18, padT = 24, padB = 22;
  const n = group.lessons.length;
  const x0 = padL + 16, x1 = W - padR - 10, y0 = H - padB - 16, y1 = padT + 6;
  const pts = group.lessons.map((l, i) => {
    const t = n === 1 ? 0.5 : i / (n - 1);
    return { l, x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, open: L.lessonOpen(state.book, l) };
  });

  let grid = "";
  for (let x = padL; x <= W - padR; x += 20) grid += `<line class="gridline" x1="${x}" y1="${padT - 10}" x2="${x}" y2="${H - padB}"/>`;
  for (let y = H - padB; y >= padT - 10; y -= 20) grid += `<line class="gridline" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"/>`;

  const lastOpen = pts.reduce((k, p, i) => (p.open ? i : k), -1);
  const drawn = lastOpen > 0
    ? `<line class="drawn" x1="${pts[0].x}" y1="${pts[0].y}" x2="${pts[lastOpen].x}" y2="${pts[lastOpen].y}"/>`
    : "";

  const dots = pts.map((p) => {
    const cls = `pt ${p.open ? "open" : "locked"}${state.justOpened.has(p.l.id) ? " just-opened" : ""}`;
    const label = `<text class="pt-label" x="${p.x}" y="${p.y - 13}">${p.l.num}</text>`;
    const circle = `<circle class="${cls}" cx="${p.x}" cy="${p.y}" r="7"/>`;
    if (!p.open) return `<g>${circle}${label}</g>`;
    const first = p.l.sheetList.find((s) => L.isReleased(state.book, s.id));
    const target = first ? first.id : L.ticketIdFor(p.l.id);
    return `<a href="#${esc(target)}" aria-label="Lesson ${p.l.num}: ${esc(p.l.title)}">${circle}${label}</a>`;
  }).join("");

  return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${openCount} of ${n} lessons in this unit are open">
    ${grid}
    <line class="axis" x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}"/>
    <line class="axis" x1="${padL}" y1="${H - padB}" x2="${padL}" y2="${padT - 10}"/>
    <line class="track" x1="${pts[0].x}" y1="${pts[0].y}" x2="${pts[n - 1].x}" y2="${pts[n - 1].y}"/>
    ${drawn}
    ${dots}
  </svg>`;
}


// ---------- Exit ticket ----------
const NAME_KEY = `et-name:${BOOK_ID}`, PERIOD_KEY = `et-period:${BOOK_ID}`, SID_KEY = `et-student:${BOOK_ID}`;
const doneKey = (lessonId) => `et-done:${BOOK_ID}:${lessonId}`;
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function recall(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } }
const ticketCache = new Map();

async function renderTicket(lessonId, lesson) {
  const tid = L.ticketIdFor(lessonId);
  document.title = `Exit ticket: ${lesson.title}`;
  root.innerHTML = `
    <div class="bar no-print"><div class="bar-inner">
      <a class="btn ghost" href="#">\u2190 All lessons</a>
      <div class="where">
        <div class="t">Lesson ${lesson.num}: ${esc(lesson.title)}</div>
        <div class="small">Exit ticket</div>
      </div>
    </div></div>
    <div id="flag"></div>
    <div class="wrap ticket-wrap" id="tk"><div class="skeleton" style="height:320px"></div></div>`;
  window.scrollTo(0, 0);
  const box = document.getElementById("tk");

  let t = ticketCache.get(lessonId);
  try {
    if (!t) {
      const snap = await getDoc(doc(db, "books", BOOK_ID, "tickets", lessonId));
      if (!snap.exists()) throw Object.assign(new Error("missing"), { code: "not-found" });
      t = snap.data(); ticketCache.set(lessonId, t);
    }
  } catch (err) {
    if (currentSheetId() !== tid) return;
    const locked = err.code === "permission-denied";
    if (locked) state.lockedSid = tid;
    box.innerHTML = `<div class="notice taped"><h2>${locked ? "This exit ticket isn\u2019t open yet" : "This exit ticket didn\u2019t load"}</h2>
      <p class="muted">${locked ? "Your teacher will open it near the end of class." : "Check your internet connection, then reload the page."}</p>
      <p><a class="btn" href="#">Back to all lessons</a></p></div>`;
    return;
  }
  if (currentSheetId() !== tid) return;
  if (!L.ticketReleased(state.book, lessonId)) {
    document.getElementById("flag").innerHTML = `<div class="preview-flag">Teacher preview. Students can\u2019t open this exit ticket yet.</div>`;
  }

  // The roster may still be loading on a fresh page; give it a moment.
  if (!Object.keys(state.roster).length) {
    try { const rs = await getDoc(doc(db, "books", BOOK_ID, "roster", "main")); if (rs.exists()) state.roster = rs.data().students || {}; } catch {}
    if (currentSheetId() !== tid) return;
  }
  const useRoster = Object.keys(state.roster).length > 0;
  const rosterPeriods = [...new Set(Object.values(state.roster).map((s) => s.period || ""))];
  const order = (state.book.periods || []);
  rosterPeriods.sort((a, b) => ((order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99)) || a.localeCompare(b));
  const periods = useRoster ? rosterPeriods.filter(Boolean) : (state.book.periods || []).filter(Boolean);
  const q = t.question || {};
  const letters = q.choices ? Object.keys(q.choices).sort() : [];
  const savedSid = recall(SID_KEY);
  const savedStudent = useRoster && state.roster[savedSid] ? { id: savedSid, ...state.roster[savedSid] } : null;
  const already = useRoster ? (savedStudent && recall(`${doneKey(lessonId)}:${savedSid}`)) : recall(doneKey(lessonId));
  const startPeriod = savedStudent ? (savedStudent.period || "") : recall(PERIOD_KEY);
  const nameOptions = (per) => L.rosterList(state.roster, per)
    .map((s) => `<option value="${esc(s.id)}" ${savedStudent && savedStudent.id === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("");

  box.innerHTML = `
    <header class="hero ticket-hero">
      <div class="eyebrow">Exit ticket</div>
      <h1 class="ticket-title">${esc(lesson.title)}</h1>
      <p class="tagline">Show what you learned today. Your teacher reads every one.</p>
    </header>
    ${already ? `<p class="again-note">${useRoster ? `${esc(savedStudent.name)}, you already turned this one in. Thanks!` : "You already turned this in. You can send a new one if you want to change your answers."}</p>` : ""}
    <form id="etForm" novalidate>
      <section class="et-card who">
        <div class="et-row">
          ${periods.length ? `<label class="et-field"><span class="et-label">Class period</span>
            <select name="period" required><option value="">Choose\u2026</option>
            ${periods.map((p) => `<option ${startPeriod === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></label>` : ""}
          ${useRoster ? `<label class="et-field"><span class="et-label">Your name</span>
            <select name="student" required ${periods.length && !startPeriod ? "disabled" : ""}>
              <option value="">${periods.length && !startPeriod ? "Choose your class period first" : "Choose your name\u2026"}</option>
              ${periods.length && !startPeriod ? "" : nameOptions(periods.length ? startPeriod : null)}
            </select></label>`
          : `<label class="et-field"><span class="et-label">Your name</span>
            <input type="text" name="name" maxlength="${L.LIMITS.name}" autocomplete="name" value="${esc(recall(NAME_KEY))}" required></label>`}
        </div>
        ${useRoster ? `<p class="et-hint">Don\u2019t see your name? Tell your teacher.</p>` : ""}
      </section>

      <section class="et-card part s2 taped">
        <div class="eyebrow">Part 1 \u00b7 Summary</div>
        <p class="et-prompt">${esc(t.summary)}</p>
        <textarea name="summary" rows="4" maxlength="${L.LIMITS.summary}" required aria-label="Summary"></textarea>
      </section>

      <section class="et-card part s3 taped">
        <div class="eyebrow">Part 2 \u00b7 Show what you know</div>
        <p class="et-prompt">${esc(q.stem).replace(/\n/g, "<br>")}</p>
        ${q.image ? `<img class="et-img" src="${esc(q.image)}" alt="${esc(q.imageAlt || "Picture for this question")}">` : ""}
        ${letters.length ? `<fieldset class="et-choices"><legend class="sr-only">Choose one answer</legend>
          ${letters.map((k) => { const pic = q.choiceImages && q.choiceImages[k]; return `<label class="et-choice${pic ? " has-pic" : ""}"><input type="radio" name="choice" value="${k}" required>
            <span class="letter">${k}</span><span class="txt">${pic ? `<img class="et-choice-img" src="${esc(pic)}" alt="Choice ${k}${q.choices[k] ? `: ${esc(q.choices[k])}` : ""}">` : ""}${esc(q.choices[k])}</span></label>`; }).join("")}
        </fieldset>` : ""}
        <label class="et-field"><span class="et-label">${esc(q.explain || "Explain your thinking.")}</span>
          <textarea name="explain" rows="3" maxlength="${L.LIMITS.explain}" required></textarea></label>
      </section>

      <section class="et-card part s4 taped">
        <div class="eyebrow">Part 3 \u00b7 How do you feel about this?</div>
        <fieldset class="et-ratings"><legend class="sr-only">How comfortable are you with this lesson?</legend>
          ${L.RATINGS.map((r) => `<label class="et-rating r${r.value}"><input type="radio" name="rating" value="${r.value}" required>
            <span class="dots" aria-hidden="true">${"\u25cf".repeat(r.value)}${"\u25cb".repeat(4 - r.value)}</span>
            <span class="txt">${esc(r.label)}</span></label>`).join("")}
        </fieldset>
      </section>

      <p class="et-error" id="etErr" role="alert" hidden></p>
      <div class="et-submit"><button class="btn primary big" type="submit" id="etSend">Turn it in \u2192</button></div>
    </form>`;

  const form = document.getElementById("etForm");
  const err = document.getElementById("etErr");
  form.addEventListener("input", () => { err.hidden = true; });
  if (useRoster && periods.length) {
    const perSel = form.querySelector("select[name=period]"), stuSel = form.querySelector("select[name=student]");
    perSel.addEventListener("change", () => {
      stuSel.disabled = !perSel.value;
      stuSel.innerHTML = `<option value="">${perSel.value ? "Choose your name\u2026" : "Choose your class period first"}</option>` + (perSel.value ? nameOptions(perSel.value) : "");
    });
  }
  form.addEventListener("change", () => { err.hidden = true; });
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(form);
    const sid = useRoster ? String(f.get("student") || "") : "";
    const picked = sid && state.roster[sid];
    const data = {
      lessonId,
      name: useRoster ? (picked ? picked.name : "") : String(f.get("name") || "").trim().slice(0, L.LIMITS.name),
      summary: String(f.get("summary") || "").trim().slice(0, L.LIMITS.summary),
      explain: String(f.get("explain") || "").trim().slice(0, L.LIMITS.explain),
      rating: parseInt(f.get("rating"), 10),
    };
    if (useRoster) { if (picked) { data.studentId = sid; data.period = picked.period || ""; } }
    else if (periods.length) data.period = String(f.get("period") || "");
    if (letters.length) data.choice = String(f.get("choice") || "");
    const missing = [];
    if (periods.length && !(useRoster ? f.get("period") : data.period)) missing.push("your class period");
    if (!data.name) missing.push("your name");
    if (!data.summary) missing.push("Part 1");
    if ((letters.length && !data.choice) || !data.explain) missing.push("Part 2");
    if (!data.rating) missing.push("Part 3");
    if (missing.length) {
      err.textContent = `Almost there! Still need: ${missing.join(", ")}.`; err.hidden = false; err.scrollIntoView({ block: "center" }); return;
    }
    err.hidden = true;
    const btn = document.getElementById("etSend"); btn.disabled = true; btn.textContent = "Sending\u2026";
    try {
      if (useRoster) {
        await setDoc(doc(db, "books", BOOK_ID, "responses", L.responseIdFor(lessonId, sid)), { ...data, createdAt: serverTimestamp() });
        store(SID_KEY, sid); store(`${doneKey(lessonId)}:${sid}`, "1");
      } else {
        await addDoc(collection(db, "books", BOOK_ID, "responses"), { ...data, createdAt: serverTimestamp() });
        store(doneKey(lessonId), "1");
      }
      store(NAME_KEY, data.name); if (data.period) store(PERIOD_KEY, data.period);
      box.innerHTML = `<div class="notice taped done">
        <div class="eyebrow">Turned in</div>
        <h2>Nice work, ${esc(data.name.split(" ")[0])}!</h2>
        <p class="tagline">You said: \u201c${esc(L.ratingLabel(data.rating))}.\u201d ${data.rating <= 2 ? "Thanks for being honest. Your teacher will help you with this." : "Keep it up!"}</p>
        <p><a class="btn" href="#">Back to all lessons</a></p></div>`;
      window.scrollTo(0, 0);
    } catch (e2) {
      console.error(e2);
      btn.disabled = false; btn.textContent = "Turn it in \u2192";
      const stillOpen = L.ticketReleased(state.book, lessonId);
      err.textContent = e2.code !== "permission-denied"
        ? "That didn\u2019t send. Check your internet connection and try again."
        : !stillOpen ? "This exit ticket just closed, so it couldn\u2019t be turned in. Let your teacher know."
        : useRoster ? `${data.name} already turned in this exit ticket. If that wasn\u2019t you, tell your teacher so they can reset it.`
        : "This couldn\u2019t be turned in. Let your teacher know.";
      err.hidden = false;
    }
  });
}

// ---------- Worksheet viewer ----------
async function renderViewer(sid, { lesson, sheet }) {
  const released = L.isReleased(state.book, sid);
  const siblings = Object.entries(lesson.sheets || {})
    .map(([id, s]) => ({ id, ...s }))
    .sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.label.localeCompare(b.label));
  const switcher = siblings.length > 1 ? siblings
    .filter((s) => L.isReleased(state.book, s.id) || s.id === sid)
    .map((s) => `<a class="btn ${s.id === sid ? "primary" : ""}" href="#${esc(s.id)}"
      ${s.id === sid ? 'aria-current="page"' : ""}>${esc(s.label)}</a>`).join("") : "";

  document.title = `${lesson.title} (${sheet.label})`;
  root.innerHTML = `
    <div class="bar no-print"><div class="bar-inner">
      <a class="btn ghost" href="#">← All lessons</a>
      <div class="where">
        <div class="t">Lesson ${lesson.num}: ${esc(lesson.title)}</div>
        <div class="muted small">${esc(sheet.label)}</div>
      </div>
      ${switcher}
      <button class="btn" id="printBtn" type="button">Print</button>
      <a class="btn" id="tabBtn" href="${esc(location.href)}" target="_blank" rel="noopener">Open in new tab</a>
    </div></div>
    <div id="flag"></div>
    ${refresherHTML(lesson, "on-sheet no-print")}
    <div class="sheet-pages" id="pages">
      ${Array.from({ length: sheet.pages || 2 }, () => `<div class="skeleton"></div>`).join("")}
    </div>`;
  window.scrollTo(0, 0);
  document.getElementById("printBtn").addEventListener("click", () => window.print());

  const pagesEl = document.getElementById("pages");
  try {
    let pages = state.pageCache.get(sid);
    if (!pages) {
      const snap = await getDocs(collection(db, "books", BOOK_ID, "sheets", sid, "pages"));
      pages = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id));
      state.pageCache.set(sid, pages);
    }
    if (currentSheetId() !== sid) return; // student moved on while loading
    if (!pages.length) throw Object.assign(new Error("empty"), { code: "empty" });
    pagesEl.innerHTML = pages.map((p, i) =>
      `<img src="${p.img}" alt="${esc(lesson.title)}, ${esc(sheet.label)}, page ${i + 1}" width="${p.w || 1400}" height="${p.h || 1812}">`
    ).join("");
    if (!released) {
      document.getElementById("flag").innerHTML =
        `<div class="preview-flag">Teacher preview. Students can't open this worksheet yet.</div>`;
    }
  } catch (err) {
    if (currentSheetId() !== sid) return;
    const locked = err.code === "permission-denied";
    if (locked) state.lockedSid = sid;
    pagesEl.innerHTML = `<div class="notice taped">
      <h2>${locked ? "This worksheet isn't open yet" : "This worksheet didn't load"}</h2>
      <p class="muted">${locked
        ? "Your teacher will open it when it's assigned."
        : "Check your internet connection, then reload the page."}</p>
      <p><a class="btn" href="#">Back to contents</a></p></div>`;
    if (!locked) console.error(err);
  }
}
</script>
</body>
</html>
